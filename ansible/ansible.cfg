[defaults]
inventory            = inventory.ini
host_key_checking    = False
retry_files_enabled  = False
deprecation_warnings = False
interpreter_python   = auto_silent

# NOTE: do NOT use `stdout_callback = yaml`.
# That resolves to community.general.yaml, which was REMOVED in
# community.general 12.0.0 and is fatal at config-parse time:
#
#   [ERROR]: The 'community.general.yaml' callback plugin has been removed.
#
# The built-in replacement, available since ansible-core 2.13, is the default
# callback plus result_format. ansible-core alone ships no community.general,
# so the built-in is also the only thing guaranteed present.
stdout_callback      = default
result_format        = yaml

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no